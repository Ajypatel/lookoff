name: LookOff
options:
  bundleIdPrefix: in.kamero
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "6.0"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  CODE_SIGN_IDENTITY: "-"
  AD_HOC_CODE_SIGNING_ALLOWED: YES
  SWIFT_STRICT_CONCURRENCY: complete
targets:
  LookOff:
    type: application
    platform: macOS
    sources:
      - path: LookOff
        excludes:
          - Info.plist
          - LookOff.entitlements
          - LookOff.sdef
    resources:
      - path: LookOff/LookOff.sdef
        type: file
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: in.kamero.lookoff
      PRODUCT_NAME: LookOff
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_FILE: LookOff/Info.plist
      CODE_SIGN_ENTITLEMENTS: LookOff/LookOff.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_LSUIElement: YES
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
      INFOPLIST_KEY_CFBundleDisplayName: LookOff
